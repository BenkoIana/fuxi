<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fit mit Fuxi</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦊</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
/* ===== Fit mit Fuxi – Design: kräftige Farben, 3D-Knöpfe, klare Karten (nach dem Vorbild moderner Lern-Apps) ===== */
:root{
  --bg:#fff8f2; --card:#ffffff; --ink:#33241a; --muted:#86766a; --line:#f1e5da; --line2:#e6d4c4;
  --pri:#ff6b2c; --pri-d:#d9480f; --pri2:#ff9a66; --pri-soft:#fff0e5;
  --green:#58cc02; --green-d:#46a302; --ok:#46a302; --ok-soft:#e9fbd9;
  --blue:#1cb0f6; --blue-d:#1899d6; --blue-soft:#ddf4ff;
  --red:#ff4b4b; --red-d:#ea2b2b; --bad:#ea2b2b; --bad-soft:#ffe5e5;
  --yellow:#ffc800; --yellow-d:#e5a800; --warn:#f59e0b; --warn-soft:#fff5d6;
  --orange:#ff9600; --teal:#14b8a6; --coral:#ff7a6b; --sun:#ffc800;
  --c1:#7c4dff; --c2:#ff7a6b; --c3:#14b8a6; --c4:#ffc93c;
  --r:20px; --shadow:0 4px 0 var(--line);
  --nav-h:68px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Nunito","Segoe UI",system-ui,-apple-system,sans-serif;font-size:18px;line-height:1.5;min-height:100vh;-webkit-tap-highlight-color:transparent}
button{font:inherit;cursor:pointer;color:inherit}
input{font:inherit}
.hidden{display:none!important}
b,strong{font-weight:800}
::selection{background:var(--pri-soft)}

/* ---------- Kopfleiste ---------- */
.top{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.94);backdrop-filter:blur(8px);border-bottom:2px solid var(--line)}
.top-in{max-width:1040px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:8px 16px;min-height:62px}
.brand{display:flex;align-items:center;gap:8px;font-weight:900;font-size:21px;color:var(--pri);background:none;border:0;padding:0;letter-spacing:-.2px}
.brand .masc{flex:none}
.top .sp{flex:1}
.topnav{display:flex;gap:4px;margin-left:12px}
.topnav button{border:2px solid transparent;background:none;border-radius:14px;padding:6px 12px;font-weight:800;font-size:16px;color:var(--muted);display:flex;align-items:center;gap:6px}
.topnav button:hover{background:var(--bg)}
.topnav button.on{color:var(--blue-d);background:var(--blue-soft);border-color:#84d8ff}
.pill{display:flex;align-items:center;gap:5px;background:none;border:0;border-radius:12px;padding:4px 8px;font-weight:900;font-size:17px;white-space:nowrap}
.pill.streak{color:var(--orange)} .pill.goal{color:var(--green-d)} .pill.lvl{color:var(--pri)}
.pill.streak.off{color:#c4b6aa;filter:grayscale(1)}
.xpbar{width:70px;height:10px;background:var(--line);border-radius:9px;overflow:hidden}
.xpbar i{display:block;height:100%;background:var(--pri);border-radius:9px}
.avatar-btn{font-size:24px;background:var(--pri-soft);border:2px solid var(--line2);border-radius:50%;width:44px;height:44px;display:grid;place-items:center;flex:none}
.parents-btn{cursor:pointer;font-weight:800;border:2px solid var(--line);border-radius:12px;background:#fff;color:var(--muted);font-size:15px;padding:5px 10px}
.parents-btn:hover{border-color:var(--line2)}

/* ---------- Navigation unten (Handy) ---------- */
#tabs{display:none}
@media (max-width:760px){
  .topnav{display:none}
  #tabs{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fff;border-top:2px solid var(--line);height:calc(var(--nav-h) + env(safe-area-inset-bottom));padding:4px 6px env(safe-area-inset-bottom)}
  #tabs button{flex:1;background:none;border:2px solid transparent;border-radius:14px;margin:4px 3px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;font-size:12px;font-weight:800;color:var(--muted);position:relative}
  #tabs button .i{font-size:25px;line-height:1.1}
  #tabs button.on{background:var(--blue-soft);border-color:#84d8ff;color:var(--blue-d)}
  #tabs .badge-n{position:absolute;top:2px;right:calc(50% - 26px);margin:0}
  main{padding-bottom:calc(var(--nav-h) + 40px)!important}
}
/* Konzentrations-Modus: beim Üben und Erklären keine Navigation */
body[data-focus] .top, body[data-focus] #tabs{display:none}
body[data-focus] main{padding-top:10px;padding-bottom:200px!important}

main{max-width:1040px;margin:0 auto;padding:22px 16px 80px}
h1{font-size:30px;margin:6px 0 14px;line-height:1.2;letter-spacing:-.3px}
h2{font-size:23px;margin:24px 0 10px;letter-spacing:-.2px}
h3{font-size:19px;margin:0 0 6px}
.muted{color:var(--muted)}
.small{font-size:15px}
.center{text-align:center}

.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:20px;border:2px solid var(--line)}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}

/* ---------- Knöpfe: kräftig, mit 3D-Kante ---------- */
.btn{--b:var(--line2);border:2px solid var(--line2);border-radius:16px;padding:11px 20px;font-weight:900;font-size:17px;background:#fff;color:var(--pri);box-shadow:0 4px 0 var(--b);transition:transform .06s,filter .15s;letter-spacing:.2px;line-height:1.25}
.btn:hover{filter:brightness(1.04)}
.btn:active{transform:translateY(4px);box-shadow:0 0 0 var(--b)}
.btn:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
.btn.primary{--b:var(--pri-d);background:var(--pri);border-color:var(--pri);color:#fff}
.btn.ok,.btn.go{--b:var(--green-d);background:var(--green);border-color:var(--green);color:#fff}
.btn.blue{--b:var(--blue-d);background:var(--blue);border-color:var(--blue);color:#fff}
.btn.danger{--b:var(--red-d);background:var(--red);border-color:var(--red);color:#fff}
.btn.ghost{background:#fff;color:var(--ink);--b:var(--line2)}
.btn.big{font-size:20px;padding:14px 28px;border-radius:18px}
.btn.wide{width:100%}
.btn:disabled{opacity:.5;cursor:default;filter:grayscale(.4)}
.btn:disabled:active{transform:none;box-shadow:0 4px 0 var(--b)}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.icon-btn{background:var(--blue-soft);border:2px solid #b8e8ff;border-radius:14px;width:46px;height:46px;font-size:21px;flex:none;box-shadow:0 3px 0 #b8e8ff}
.icon-btn:active{transform:translateY(3px);box-shadow:none}
.x-btn{background:none;border:0;font-size:28px;color:#bba99b;width:44px;height:44px;border-radius:12px;flex:none;font-weight:900}
.x-btn:hover{background:var(--line)}

/* ---------- Euli ---------- */
.masc{display:block;flex:none;overflow:visible}
.masc.bob{animation:bob 3s ease-in-out infinite}
.masc-cheer .arm-l,.masc-cheer .arm-r{animation:flap .5s ease-in-out 3}
@keyframes bob{50%{transform:translateY(-6px) rotate(-2deg)}}
@keyframes flap{50%{transform:translateY(-4px)}}
.mascot{line-height:1}
.say{display:flex;align-items:flex-end;gap:12px}
.bubble{position:relative;background:var(--card);border:2px solid var(--line);border-radius:20px;padding:14px 18px;box-shadow:var(--shadow);flex:1;min-width:0;font-weight:700}
.bubble::before{content:"";position:absolute;left:-11px;bottom:22px;width:18px;height:18px;background:#fff;border-left:2px solid var(--line);border-bottom:2px solid var(--line);transform:rotate(45deg)}

/* ---------- Startseite ---------- */
.hero{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-bottom:18px}
.hero .say{flex:1;min-width:260px}
.ring{width:118px;height:118px;flex:none}
.cta{background:linear-gradient(135deg,#ff6b2c,#ff9248);color:#fff;border:0;border-radius:24px;padding:22px;box-shadow:0 6px 0 var(--pri-d);display:flex;gap:18px;align-items:center;margin:0 0 22px;flex-wrap:wrap}
.cta h2{margin:0 0 4px;color:#fff;font-size:24px}
.cta p{margin:0;opacity:.92;font-size:16px}
.cta .btn{--b:#ffd2b8;background:#fff;color:var(--pri);border-color:#fff}
.tile{cursor:pointer;display:flex;flex-direction:column;gap:4px;transition:transform .12s;text-align:left;font:inherit;color:inherit}
.tile:hover{transform:translateY(-3px)}
.tile:active{transform:translateY(2px);box-shadow:none}
.tile .ic{font-size:38px;line-height:1.1}
.badge-n{background:var(--red);color:#fff;border-radius:999px;padding:0 8px;font-size:13px;font-weight:900;margin-left:6px;line-height:20px;display:inline-block;min-width:20px;text-align:center}
.plan-step{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-top:2px dashed var(--line)}
.plan-step:first-of-type{border-top:0}
.plan-step .chk{width:30px;height:30px;border-radius:50%;border:3px solid var(--line2);flex:none;display:grid;place-items:center;font-size:16px;color:#fff;font-weight:900;margin-top:2px}
.plan-step .chk.done{background:var(--green);border-color:var(--green)}
.count{background:var(--pri-soft);border-radius:18px;padding:8px 14px;text-align:center;min-width:86px}
.count .stat{font-size:40px;line-height:1}

/* ---------- Lernpfad (Themen) ---------- */
.unit{border-radius:20px;padding:16px 20px;color:#fff;margin:28px 0 8px;box-shadow:0 5px 0 rgba(0,0,0,.18);display:flex;align-items:center;gap:14px}
.unit .ul{font-size:14px;font-weight:900;opacity:.85;text-transform:uppercase;letter-spacing:.6px}
.unit h2{margin:0;font-size:22px;color:#fff}
.unit .uic{font-size:34px;width:54px;height:54px;border-radius:16px;background:rgba(255,255,255,.22);display:grid;place-items:center;flex:none}
.path{display:flex;flex-direction:column;align-items:center;gap:10px;padding:14px 0 6px}
.node{display:flex;flex-direction:column;align-items:center;gap:6px;width:200px;text-align:center;background:none;border:0;padding:0;font:inherit;color:inherit}
.node .disc{position:relative;width:84px;height:84px;border-radius:50%;display:grid;place-items:center;font-size:36px;background:var(--uc,var(--pri));box-shadow:0 7px 0 var(--ud,var(--pri-d));transition:transform .08s}
.node:active .disc{transform:translateY(5px);box-shadow:0 2px 0 var(--ud,var(--pri-d))}
.node .disc.fresh{background:#f1e8df;box-shadow:0 7px 0 #dfd0c2}
.node .disc.gold{background:var(--yellow);box-shadow:0 7px 0 var(--yellow-d)}
.node .disc svg.pring{position:absolute;inset:-9px;width:102px;height:102px;pointer-events:none}
.node .disc .flag{position:absolute;top:-6px;right:-8px;font-size:20px;background:#fff;border-radius:50%;width:32px;height:32px;display:grid;place-items:center;box-shadow:0 2px 0 var(--line2);border:2px solid var(--line)}
.node .nt{font-weight:800;font-size:15px;line-height:1.25}
.node .nm{font-size:13px;color:var(--muted);font-weight:700}
.node:hover .disc{filter:brightness(1.05)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:14px;color:var(--muted);font-weight:700}

/* alte Themen-Kacheln (Elternbereich u. a.) */
.group-title{display:flex;align-items:center;gap:8px}
.topic{cursor:pointer;display:flex;gap:12px;align-items:center;padding:14px 16px;transition:transform .12s}
.topic .ic{font-size:32px;width:52px;height:52px;border-radius:14px;display:grid;place-items:center;background:var(--pri-soft);flex:none}
.topic .t{font-weight:800;line-height:1.25}
.stars{color:var(--yellow);letter-spacing:2px;font-size:18px;text-shadow:0 1px 0 var(--yellow-d)}
.stars .off{color:#eadfd5;text-shadow:none}
.mbar{height:12px;background:var(--line);border-radius:9px;overflow:hidden;margin-top:5px}
.mbar i{display:block;height:100%;background:var(--green);border-radius:9px;box-shadow:inset 0 -3px 0 rgba(0,0,0,.08)}
.tag{display:inline-block;font-size:13px;font-weight:800;border-radius:8px;padding:1px 8px;background:var(--warn-soft);color:#a16207;margin-left:4px}
.tag.school{background:var(--blue-soft);color:var(--blue-d)}

/* Themen-Detail */
.topic-hero{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.topic-hero .big-ic{width:96px;height:96px;border-radius:28px;display:grid;place-items:center;font-size:52px;background:var(--pri-soft);box-shadow:0 5px 0 var(--line2);flex:none}
.stat-chips{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}
.chip{border:2px solid var(--line);border-radius:14px;padding:6px 12px;font-weight:800;font-size:15px;background:#fff}

/* ---------- Kopf im Konzentrations-Modus (Üben, Erklären) ---------- */
.focusbar{display:flex;align-items:center;gap:12px;max-width:760px;margin:0 auto 18px}
.progress{flex:1;height:18px;background:var(--line);border-radius:12px;overflow:hidden;margin:0}
.progress i{display:block;height:100%;background:var(--green);border-radius:12px;transition:width .45s cubic-bezier(.3,1.4,.6,1);position:relative;min-width:18px}
.progress i::after{content:"";position:absolute;left:10px;right:10px;top:4px;height:5px;border-radius:4px;background:rgba(255,255,255,.35)}
.combo{font-weight:900;color:var(--orange);font-size:18px;min-width:44px;text-align:right}
.combo.zero{color:#d8cabd}

/* ---------- Erklärungen ---------- */
.lesson-head{display:flex;align-items:center;gap:12px}
.dots{display:flex;gap:6px;flex:1}
.dots i{flex:1;height:14px;border-radius:8px;background:var(--line)}
.dots i.on{background:var(--blue)}
.slide{min-height:300px;animation:pop .3s ease;max-width:760px;margin:0 auto}
.slide-meta{font-size:14px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
@keyframes pop{from{opacity:0;transform:translateY(10px)}}
.slide p{margin:8px 0}
.merke{background:var(--warn-soft);border:2px solid #ffe08a;border-radius:16px;padding:14px 18px;margin:14px 0}
.merke::before{content:"📌 Merke dir";display:block;font-weight:900;color:#b45309;margin-bottom:4px;font-size:15px;text-transform:uppercase;letter-spacing:.5px}
.story{background:var(--blue-soft);border:2px solid #b8e8ff;border-radius:16px;padding:14px 18px;margin:14px 0}
.oops{background:var(--bad-soft);border:2px solid #ffc1c1;border-radius:16px;padding:14px 18px;margin:14px 0}
.oops::before{content:"⚠️ Typischer Fehler";display:block;font-weight:900;color:var(--red-d);margin-bottom:4px;font-size:15px;text-transform:uppercase;letter-spacing:.5px}
.widget{background:#fffaf6;border:2px solid var(--line2);border-radius:20px;padding:16px;margin:16px 0;text-align:center;box-shadow:0 4px 0 var(--line)}
.widget .ctrl{display:flex;gap:18px;justify-content:center;flex-wrap:wrap;margin:10px 0}
.widget label{font-weight:800;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:16px}
.widget input[type=range]{width:190px;accent-color:var(--pri);height:28px}
.widget .out{font-size:22px;font-weight:800;margin-top:6px}
.widget-hint{font-size:14px;color:var(--pri);font-weight:900;margin-bottom:6px;text-transform:uppercase;letter-spacing:.4px}
table.tbl{border-collapse:separate;border-spacing:0;margin:10px auto;border:2px solid var(--line2);border-radius:14px;overflow:hidden}
table.tbl td,table.tbl th{border-right:2px solid var(--line);border-bottom:2px solid var(--line);padding:7px 12px;text-align:center}
table.tbl tr:last-child td{border-bottom:0} table.tbl td:last-child,table.tbl th:last-child{border-right:0}
table.tbl th{background:var(--pri-soft)}
@media (max-width:600px){table.tbl{display:block;max-width:100%;overflow-x:auto;width:max-content}table.tbl td,table.tbl th{padding:5px 8px}}
textarea{width:100%;min-height:110px;border:2px solid var(--line2);border-radius:16px;padding:12px 14px;font:inherit;background:#fff}
textarea:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 4px var(--blue-soft)}

/* Brüche */
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 3px;line-height:1.1;font-weight:800}
.fr>span:first-child{border-bottom:2.5px solid currentColor;padding:0 4px}
.fr>span:last-child{padding:0 4px}

/* ---------- Aufgabe ---------- */
.task-wrap{max-width:760px;margin:0 auto}
.task .q-row{display:flex;gap:12px;align-items:flex-start}
.task .q{font-size:25px;font-weight:800;flex:1;line-height:1.5}
.task .meta{font-size:13px;color:var(--muted);font-weight:900;margin-bottom:8px;text-transform:uppercase;letter-spacing:.5px}
.visual{display:flex;justify-content:center;margin:16px 0;overflow-x:auto}
.visual svg,.card svg:not(.ring):not(.masc):not(.pring){max-width:100%;height:auto}
.answer-area{display:flex;justify-content:center;align-items:center;gap:10px;margin:22px 0;flex-wrap:wrap;font-size:24px;font-weight:800}
.ans{width:180px;font-size:28px;font-weight:900;text-align:center;border:2px solid var(--line2);border-radius:16px;padding:10px;background:#fff;color:var(--ink);box-shadow:0 4px 0 var(--line)}
.ans:focus{outline:none;border-color:var(--blue);box-shadow:0 4px 0 #84d8ff}
.ans:disabled{background:#fdfaf7;color:var(--ink)}
.frac-in{display:inline-flex;flex-direction:column;align-items:center;gap:8px}
.frac-in .ans{width:100px}
.frac-in .line{width:116px;height:4px;background:var(--ink);border-radius:3px}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;width:100%;max-width:640px}
.choice{font-size:22px;font-weight:800;padding:14px 16px;border-radius:16px;border:2px solid var(--line2);background:#fff;color:var(--ink);box-shadow:0 4px 0 var(--line2);transition:transform .06s;min-height:62px}
.choice:hover:not(:disabled){background:#fff8f2}
.choice:active:not(:disabled){transform:translateY(4px);box-shadow:none}
.choice.picked-bad{border-color:var(--red);background:var(--bad-soft);color:var(--red-d);box-shadow:0 4px 0 #ffb3b3}
.choice.picked-ok{border-color:var(--green);background:var(--ok-soft);color:var(--green-d);box-shadow:0 4px 0 #b6ec8e}
.choice:disabled{cursor:default}
.task-actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.hint-box{display:flex;gap:10px;align-items:flex-end;margin:12px 0}
.hint-box .hb{background:var(--warn-soft);border:2px solid #ffe08a;border-radius:18px;padding:10px 16px;flex:1;position:relative}
.hint-box .hb div{margin:3px 0}
.hint-box .hb div::before{content:"💡 "}
.fb{border-radius:18px;padding:14px 18px;margin:14px 0;animation:pop .25s}
.fb.ok{background:var(--ok-soft);color:#2f6d00}
.fb.try{background:var(--warn-soft);color:#8a4b00}
.fb.bad{background:var(--bad-soft);color:#9b1c1c}
.fb .head{font-weight:900;font-size:21px;display:flex;align-items:center;gap:10px}
.fb details{margin-top:6px} .fb summary{cursor:pointer;font-weight:800}
ol.steps{margin:10px 0;padding-left:26px;color:var(--ink)}
ol.steps li{margin:6px 0;animation:pop .35s both}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.xp-pop{display:inline-block;background:var(--yellow);color:#5a3b00;border-radius:999px;padding:0 10px;font-weight:900;font-size:16px;animation:pop .3s}

/* Prüfen-Leiste unten (wie in Lern-Apps): beim Üben fest am unteren Rand, färbt sich grün/rot */
.checkbar{margin-top:10px}
.practice-task .checkbar{position:fixed;left:0;right:0;bottom:0;z-index:40;background:#fff;border-top:2px solid var(--line);padding:14px 16px calc(14px + env(safe-area-inset-bottom));transition:background .2s}
.practice-task .checkbar .inner{max-width:760px;margin:0 auto}
.practice-task .checkbar .fb{margin:0 0 12px;padding:0;background:none;max-height:42vh;overflow:auto}
.practice-task .checkbar.s-ok{background:#d7ffb8;border-top-color:#b6ec8e}
.practice-task .checkbar.s-try{background:#fff1c9;border-top-color:#ffe08a}
.practice-task .checkbar.s-bad{background:#ffdfe0;border-top-color:#ffc1c1}
.practice-task .checkbar .task-actions{flex-wrap:nowrap}
.practice-task .checkbar .task-actions .btn{flex:1;max-width:340px}
.practice-task .checkbar .task-actions .btn[data-hint]{flex:0 1 auto}
.checkbar.s-bad .btn[data-next]{--b:var(--red-d);background:var(--red);border-color:var(--red)}
.checkbar.s-ok .btn[data-next]{--b:var(--green-d);background:var(--green);border-color:var(--green)}
.inline-task .checkbar{border-top:2px solid var(--line);padding-top:14px}

/* ---------- Abschluss & Erfolge ---------- */
.big-emoji{font-size:80px;text-align:center}
.result-tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:20px 0}
.rt{border:2px solid var(--c);border-radius:18px;overflow:hidden;background:#fff}

<script>
/* ===== Fit mit Fuxi – Hilfsfunktionen ===== */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const rnd = (a, b) => Math.floor(Math.random() * (b - a + 1)) + a;
const pick = a => a[Math.floor(Math.random() * a.length)];
const shuffle = a => { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const today = () => dkey(new Date());
const dkey = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const dayDiff = (a, b) => Math.round((new Date(b + 'T12:00:00') - new Date(a + 'T12:00:00')) / 864e5);
const WTAG = ['So', 'Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa'];
const COLS = ['#ff6b2c', '#1cb0f6', '#58cc02', '#ffc800', '#7c4dff', '#ff6fae', '#14b8a6'];
function hash(s) { let h = 5381; for (const c of String(s)) h = (h * 33 + c.charCodeAt(0)) >>> 0; return h.toString(36); }

/* ---------- Antworten vergleichen: tolerant bei Groß/klein, Umlauten, Artikeln, kleinen Tippfehlern ---------- */
const plain = s => String(s ?? '').replace(/<[^>]+>/g, '').replace(/&nbsp;/g, ' ');
function normAns(s, keepCase = false) {
  s = plain(s).trim().replace(/[’‘´`]/g, "'").replace(/[„“”"]/g, '').replace(/\s+/g, ' ').replace(/[.!?;:,]+$/, '').trim();
  if (!keepCase) s = s.toLowerCase();
  return s;
}
const deUml = s => s.replace(/ä/g, 'ae').replace(/ö/g, 'oe').replace(/ü/g, 'ue').replace(/ß/g, 'ss').replace(/Ä/g, 'Ae').replace(/Ö/g, 'Oe').replace(/Ü/g, 'Ue');
const noArt = s => s.replace(/^(der|die|das|den|dem|des|ein|eine|einen|the|a|an|to) /i, '');
function lev(a, b) {
  if (a === b) return 0; const m = a.length, n = b.length; if (!m || !n) return m || n;
  let p = Array.from({ length: n + 1 }, (_, j) => j);
  for (let i = 1; i <= m; i++) { const c = [i]; for (let j = 1; j <= n; j++) c[j] = Math.min(p[j] + 1, c[j - 1] + 1, p[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1)); p = c; }
  return p[n];
}
/* Ergebnis: 'ok' | 'case' (nur Groß/klein falsch) | 'typo' (fast richtig) | null */
function matchText(input, answers, { exakt = false } = {}) {
  const raw = normAns(input, true); if (!raw) return null;
  let best = null;
  for (const a of answers) {
    const A = normAns(a, true);
    if (raw === A) return { r: 'ok', a };
    const sq = s => deUml(noArt(s.toLowerCase())).replace(/[\s.\-]/g, '');  // „St.Pölten“ = „St. Pölten“, „100°C“ = „100 °C“
    const x = sq(raw), y = sq(A);
    if (x === y) { if (exakt && noArt(raw) !== noArt(A)) best = best || { r: 'case', a }; else return { r: 'ok', a }; continue; }
    const tol = y.length >= 9 ? 2 : y.length >= 4 ? 1 : 0, d = lev(x, y);
    if (d <= tol && (!best || best.r !== 'case')) best = { r: 'typo', a };
  }
  return best;
}

/* ===== Fuxi, der schlaue Fuchs – als Zeichnung. Stimmungen: happy, cheer, think, comfort, wave ===== */
function fuxi(mood = 'happy', size = 96, cls = '') {
  const al = { cheer: 140 }[mood] ?? 20, ar = { cheer: -140, wave: -155 }[mood] ?? -20;
  const look = mood === 'think' ? [5, -5] : mood === 'comfort' ? [0, 3] : [2, 1];
  const eye = cx => mood === 'cheer'
    ? `<path d="M${cx - 12},88 Q${cx},74 ${cx + 12},88" stroke="#2a1a10" stroke-width="7" fill="none" stroke-linecap="round"/>`
    : `<ellipse cx="${cx}" cy="86" rx="13" ry="15" fill="#fff"/><circle cx="${cx + look[0]}" cy="${88 + look[1]}" r="8.5" fill="#2a1a10"/><circle cx="${cx + look[0] + 3}" cy="${84 + look[1]}" r="3" fill="#fff"/>`
      + (mood === 'comfort' ? (cx < 100 ? `<path d="M${cx - 14},66 L${cx + 10},60" stroke="#8a3a0c" stroke-width="5" stroke-linecap="round"/>` : `<path d="M${cx + 14},66 L${cx - 10},60" stroke="#8a3a0c" stroke-width="5" stroke-linecap="round"/>`) : '');
  const mouth = mood === 'cheer' ? '<path d="M88,126 Q100,142 112,126 Z" fill="#8a2a0c"/>' : mood === 'comfort' ? '<path d="M91,131 Q100,126 109,131" stroke="#2a1a10" stroke-width="4" fill="none" stroke-linecap="round"/>' : '<path d="M90,126 Q95,132 100,126 Q105,132 110,126" stroke="#2a1a10" stroke-width="4" fill="none" stroke-linecap="round"/>';
  return `<svg class="masc ${cls} masc-${mood}" width="${size}" height="${size}" viewBox="0 0 200 200" role="img" aria-label="Fuxi der Fuchs">
    <path d="M140,176 C196,176 198,120 176,96 C186,130 166,150 136,150 Z" fill="#ff7a1a"/><path d="M176,96 C186,116 184,132 176,142 C172,126 170,110 176,96 Z" fill="#fff"/>
    <g class="arm-l"><ellipse cx="62" cy="168" rx="13" ry="26" fill="#e8620c" transform="rotate(${al} 66 150)"/></g>
    <g class="arm-r"><ellipse cx="138" cy="168" rx="13" ry="26" fill="#e8620c" transform="rotate(${ar} 134 150)"/></g>
    <ellipse cx="100" cy="166" rx="44" ry="32" fill="#ff7a1a"/><ellipse cx="100" cy="172" rx="25" ry="22" fill="#fff4e8"/>
    <path d="M46,74 L52,14 L94,48 Z" fill="#ff7a1a"/><path d="M56,62 L60,30 L82,50 Z" fill="#5b2a12"/>
    <path d="M154,74 L148,14 L106,48 Z" fill="#ff7a1a"/><path d="M144,62 L140,30 L118,50 Z" fill="#5b2a12"/>
    <path d="M34,92 Q36,46 100,44 Q164,46 166,92 Q164,124 100,146 Q36,124 34,92 Z" fill="#ff7a1a"/>
    <path d="M36,98 Q70,96 100,146 Q130,96 164,98 Q158,128 100,148 Q42,128 36,98 Z" fill="#fff4e8"/>
    ${eye(74)}${eye(126)}
    <circle cx="56" cy="108" r="7" fill="#ff8fa3" opacity=".55"/><circle cx="144" cy="108" r="7" fill="#ff8fa3" opacity=".55"/>
    <ellipse cx="100" cy="116" rx="10" ry="7" fill="#2a1a10"/><circle cx="97" cy="114" r="2.5" fill="#fff" opacity=".7"/>
    ${mouth}
    ${mood === 'think' ? '<text x="160" y="40" font-size="40" font-weight="900" fill="#ff6b2c">?</text>' : ''}${mood === 'cheer' ? '<text x="152" y="34" font-size="28">✨</text><text x="14" y="38" font-size="24">✨</text>' : ''}
  </svg>`;
}

/* ===== Stoff-Register: hier hängen sich die Dateien in stoff/ ein ===== */
const FAECHER = [
  { id: 'deutsch', name: 'Deutsch', icon: '✍️', c: '#ff4b4b', d: '#ea2b2b', spell: true },
  { id: 'englisch', name: 'Englisch', icon: '💂', c: '#1cb0f6', d: '#1899d6', spell: true, lang: 'en' },
  { id: 'geografie', name: 'Geografie', icon: '🌍', c: '#14b8a6', d: '#0f8f81' },
  { id: 'geschichte', name: 'Geschichte', icon: '🏛️', c: '#f59e0b', d: '#c27c0e' },
  { id: 'biologie', name: 'Biologie', icon: '🌿', c: '#58cc02', d: '#46a302' },
  { id: 'physik', name: 'Physik', icon: '⚡', c: '#7c4dff', d: '#5b2fd6' },
  { id: 'dgb', name: 'Digitale Grundbildung', icon: '💻', c: '#ff6fae', d: '#e0458b' },
];
const FACH = Object.fromEntries(FAECHER.map(f => [f.id, f]));
const THEMEN = [], THEMA = {}, FRAGE = {}, TESTS_C = [];

/* thema(fach, { id, title, icon, gruppe, src, aktuell, lern:[{h, html}], karten:{f, r, list}, fragen:[…] })
   Fragen-Kurzschreibweise:
   { q, a }                       → Antwort eintippen (a: Text oder Liste erlaubter Antworten); c: [falsche] → bei Stufe 1–2 Auswahl
   { q, c:[…], a }                → nur Auswahl (wenn a in c steht)
   { q, tf:true|false }           → richtig oder falsch
   { q, m:[…], a:[…] }            → mehrere richtig ankreuzen
   { q:'… ___ …', gap:[…] }        → Lückentext (eine Lücke pro ___)
   { q, order:[…] }               → in die richtige Reihenfolge bringen
   { q, pairs:[[l, r], …] }       → zuordnen
   immer möglich: tipp (Text/Liste), erk (Erklärung), falsch {Antwort: Hinweis}, exakt (Groß/klein zählt) */
function thema(fid, o) {
  const f = FACH[fid]; if (!f) throw new Error('Fach fehlt: ' + fid);
  const t = Object.assign({ fach: fid, icon: f.icon, gruppe: '', lern: [], fragen: [] }, o), qs = [];
  const add = (q, key) => { q.id = t.id + ':' + hash(key); q.thema = t.id; while (FRAGE[q.id]) q.id += 'x'; FRAGE[q.id] = q; qs.push(q.id); };
  for (const r of t.fragen) {
    const q = Object.assign({}, r);
    q.tipp = [].concat(r.tipp || []);
    if (r.tf !== undefined) { q.kind = 'tf'; q.a = r.tf ? 'Richtig' : 'Falsch'; q.c = ['Richtig', 'Falsch']; }
    else if (r.m) q.kind = 'multi';
    else if (r.gap) q.kind = 'gap';
    else if (r.order) q.kind = 'order';
    else if (r.pairs) q.kind = 'match';
    else if (r.c && r.c.includes(r.a)) q.kind = 'choice';
    else { q.kind = 'text'; q.a = [].concat(r.a); q.wrong = r.c || null; }
    add(q, q.kind + q.q + (r.a || ''));
  }
  if (t.karten) {
    const K = t.karten, fill = (s, p) => s.replace(/\{(\d)\}/g, (_, i) => p[i]);
    const pool0 = K.list.map(p => p[1]), pool1 = K.list.map(p => p[0]);
    for (const p of K.list) {
      add({ kind: 'text', q: fill(K.f, p), a: String(p[1]).split('|'), pool: pool0, tipp: [].concat(p[3] || []), erk: p[2] || '', exakt: K.exakt }, 'k' + p[0] + '>' + p[1]);
      if (K.r) add({ kind: 'text', q: fill(K.r, p), a: String(p[0]).split('|'), pool: pool1, tipp: [], erk: p[2] || '', exakt: K.exakt, rev: true }, 'r' + p[1] + '>' + p[0]);
    }
  }
  t.qs = qs; THEMEN.push(t); THEMA[t.id] = t; return t;
}

        <button class="btn big" onclick="startDaily()">${d.n ? 'Weiter üben' : "Los geht's"} ▶</button></div>
      <div class="grid g2">
        <button class="card tile" onclick="startMistakes()"><div class="ic">🧰</div><h3 style="margin:0">Fehler-Kiste ${nm ? `<span class="badge-n">${nm}</span>` : ''}</h3><div class="muted small">${nm ? 'Knack deine alten Fehler!' : 'Leer – super!'}</div></button>
        <button class="card tile" onclick="go('badges')"><div class="ic">🏆</div><h3 style="margin:0">Meine Erfolge</h3><div class="muted small">${S.badges.length} von ${BADGES.length} Abzeichen</div></button>
      </div>
      <div class="say" style="margin-top:22px">${fuxi('happy', 64)}<div class="bubble" style="font-weight:600"><b>💡 Tipp des Tages:</b> ${TIPS[new Date().getDate() % TIPS.length]}</div></div>`;
  },

  faecher() {
    app().innerHTML = `<div class="say" style="max-width:640px;margin:0 auto 16px">${fuxi('happy', 76)}<div class="bubble">Such dir ein Fach aus – dort findest du alle Themen, Lernzettel und Tests.</div></div>
      <div class="faecher">${FAECHER.map(f => { const k = fachThemen(f.id).length, t = nextTestOf(f.id); return `<button class="fach" style="${fstyle(f)}" onclick="go('fach','${f.id}')">${t ? `<span class="ftest">📝 ${t.days === 0 ? 'heute' : t.days + ' T.'}</span>` : ''}<div class="fi">${f.icon}</div><div class="fn">${f.name}</div><div class="fs">${k ? `${k} ${k === 1 ? 'Thema' : 'Themen'}` : 'noch kein Stoff'}</div></button>`; }).join('')}
      <a class="fach extra" href="${MATHE_URL}" style="text-decoration:none"><div class="fi">🦉</div><div class="fn">Mathe</div><div class="fs" style="color:var(--muted)">bei Euli</div></a></div>`;
  },

  fach(fid) {
    const f = FACH[fid], list = fachThemen(fid), tests = upcoming().filter(t => t.fach === fid);
    const zig = [0, 56, 84, 56, 0, -56, -84, -56];
    const groups = [...new Set(list.map(t => t.gruppe))];
    const testCard = t => {
      const fresh = t.ids.filter(id => !tp(id).lesson).map(id => THEMA[id]);
      const step = (done, html) => `<div class="plan-step"><div class="chk ${done ? 'done' : ''}">${done ? '✓' : ''}</div><div style="flex:1">${html}</div></div>`;
      const plan = t.days === 0 ? `<div class="merke">Heute ist es so weit! 🍀 Tief durchatmen, jede Frage genau lesen, mit dem Leichtesten anfangen. Du hast geübt – du schaffst das!</div><button class="btn" onclick="startTestPrep('${t.id}', 6)">🔁 Kurz aufwärmen (6 Fragen)</button>`
        : (fresh.length ? step(false, `<b>Lernzettel lesen:</b> ${fresh.slice(0, 3).map(x => `<button class="btn" style="margin:4px 4px 0 0" onclick="go('lesson','${x.id}')">${x.icon} ${x.title}</button>`).join('')}`) : step(true, '<b>Alle Lernzettel gelesen</b> 👍'))
        + step(false, `<b>Für den Test üben</b> – 10 Fragen aus dem Stoff, mit Tipps <button class="btn go" onclick="startTestPrep('${t.id}')">▶ Start</button>`)
        + step(false, `<b>Lernkarten</b> durchblättern <button class="btn" onclick="startCards('${t.id}')">🃏 Karten</button>`)
        + (t.days <= 7 || t.ready >= 50 ? step(false, `<b>Probe-Test</b> – wie echt: ohne Tipps, alles selbst schreiben, mit Note <button class="btn" onclick="startProbe('${t.id}')">📝 Start</button>`) : '');
      return `<div class="card" style="margin-bottom:18px;border-color:#ffe08a;box-shadow:0 4px 0 #ffe08a"><div class="row" style="align-items:center;flex-wrap:nowrap"><div class="count" style="background:${f.c}22"><div class="stat" style="color:${f.d}">${t.days}</div><div class="small" style="font-weight:800;color:${f.d}">${t.days === 1 ? 'Tag' : 'Tage'}</div></div>
        <div style="flex:1;min-width:0"><h3 style="margin:0">📝 ${esc(t.name)}</h3><div class="small muted">${t.label} · vorbereitet: <b>${t.ready} %</b></div><div class="mbar" style="height:14px"><i style="width:${t.ready}%"></i></div></div></div>
        ${t.info ? `<p class="small" style="margin:10px 0 0"><b>Stoff:</b> ${t.info}</p>` : ''}
        <div class="slide-meta" style="margin:14px 0 2px">📋 Dein Plan</div>${plan}</div>`;
    };
    app().innerHTML = `<button class="btn ghost" onclick="go('home')">← Start</button>
      <div class="fach-head" style="${fstyle(f)}"><div class="fi">${f.icon}</div><div style="flex:1"><h1>${f.name}</h1><div style="font-weight:800;opacity:.92">${list.length ? `${list.length} ${list.length === 1 ? 'Thema' : 'Themen'} · ${fachMastery(fid)} % gelernt` : 'noch kein Stoff'}</div></div></div>
      ${tests.map(testCard).join('')}
      ${list.length ? `<div class="row" style="margin-bottom:8px"><button class="btn go big" onclick="startFach('${fid}')">✏️ ${f.name} üben (10 Fragen)</button><button class="btn big" onclick="startCards(null,'${fid}')">🃏 Lernkarten</button><button class="btn ghost" onclick="startProbe(null,'${fid}')">📝 Probe-Test</button></div>`
        : `<div class="say" style="margin-top:20px">${fuxi('comfort', 80)}<div class="bubble">Für ${f.name} habe ich noch keinen Lernstoff. Sobald der Stoff für den nächsten Test da ist, kannst du hier üben! 📚</div></div>`}
      ${groups.map((g, gi) => `<div class="unit" style="background:${f.c}"><div class="uic">${f.icon}</div><div><div class="ul">${f.name}</div><h2>${g || 'Themen'}</h2></div></div>
        <div class="path" style="--uc:${f.c};--ud:${f.d}">${list.filter(t => t.gruppe === g).map((t, i) => {
          const s = tp(t.id), st = starsOf(t.id), m = masteryOf(t.id), state = st === 3 ? 'gold' : (s.seen || s.lesson) ? '' : 'fresh', R = 46, C = 2 * Math.PI * R;
          const flag = tests.some(x => x.ids.includes(t.id)) ? '📝' : t.aktuell ? '🏫' : '';
          return `<button class="node" style="transform:translateX(${zig[i % zig.length]}px)" onclick="go('topic','${t.id}')" aria-label="${esc(t.title)}">
            <div class="disc ${state}">${t.icon}${state === '' ? `<svg class="pring" viewBox="0 0 102 102"><circle cx="51" cy="51" r="${R}" fill="none" stroke="#f1e5da" stroke-width="6"/><circle cx="51" cy="51" r="${R}" fill="none" stroke="${f.c}" stroke-width="6" stroke-linecap="round" stroke-dasharray="${C * m / 100} ${C}" transform="rotate(-90 51 51)"/></svg>` : ''}${flag ? `<span class="flag">${flag}</span>` : ''}</div>
            <div class="nt">${t.title}</div><div class="nm">${starsHTML(st)}</div></button>`;
        }).join('')}</div>`).join('')}`;
  },

  topic(id) {
    const t = THEMA[id], f = FACH[t.fach], s = tp(id), m = masteryOf(id), sat = t.qs.filter(q => qsPeek(q).b >= BOX_MAX).length;
    app().innerHTML = `<button class="btn ghost" onclick="go('fach','${t.fach}')">← ${f.name}</button>
      <div class="card" style="margin-top:16px"><div class="topic-hero"><div class="big-ic" style="background:${f.c};box-shadow:0 6px 0 ${f.d}">${t.icon}</div><div style="flex:1;min-width:220px"><div class="slide-meta">${f.icon} ${f.name}${t.src ? ' · 📘 ' + t.src : ''}</div><h1 style="margin:2px 0 4px">${t.title}</h1>${t.desc ? `<div class="muted">${t.desc}</div>` : ''}</div></div>
      <div class="stat-chips"><span class="chip">${starsHTML(starsOf(id))}</span><span class="chip">✅ ${sat} von ${t.qs.length} Fragen sitzen</span>${s.seen ? `<span class="chip">🎯 ${Math.round(s.ok / s.seen * 100)} % richtig</span>` : ''}</div>
      <div class="small" style="font-weight:800;color:var(--muted)">Gelernt: ${m} %</div><div class="mbar" style="height:16px"><i style="width:${m}%"></i></div>
      <div class="row" style="margin-top:22px">${t.lern.length ? `<button class="btn ${s.lesson ? 'ghost' : 'blue'} big" onclick="go('lesson','${id}')">📖 Lernzettel${s.lesson ? ' nochmal' : ''}</button>` : ''}<button class="btn ${s.lesson || !t.lern.length ? 'go' : 'ghost'} big" onclick="startTopic('${id}')">✏️ Üben</button><button class="btn big" onclick="startCards(null,null,'${id}')">🃏 Lernkarten</button></div>
      ${S.notes[id] ? `<div class="merke" style="margin-top:18px">So habe ich es erklärt:<br><i>„${esc(S.notes[id])}“</i></div>` : ''}</div>
      <div class="say" style="margin-top:18px">${fuxi('happy', 64)}<div class="bubble" style="font-weight:600"><b>So lernst du mit mir:</b> Am Anfang darfst du aus Antworten auswählen. Je besser eine Frage sitzt, desto öfter musst du die Antwort <b>selbst schreiben</b> – genau wie beim Test. Eine Frage „sitzt“, wenn du sie ${BOX_MAX}-mal hintereinander gleich richtig hast.</div></div>`;
  },

  lesson(id, i = 0) {
    const t = THEMA[id], f = FACH[t.fach];
    const slides = [...t.lern, { kind: 'check', h: '✏️ Jetzt du!' }, { kind: 'reflect', h: '💭 Erklär es in deinen Worten' }];
    const sl = slides[i];
    app().innerHTML = `<div class="focusbar"><button class="x-btn" onclick="go('topic','${id}')" aria-label="Schließen">✕</button><div class="dots">${slides.map((_, k) => `<i class="${k <= i ? 'on' : ''}"></i>`).join('')}</div><button class="icon-btn" id="sayl" title="Vorlesen">🔊</button></div>
      <div class="card slide lern"><div class="slide-meta">${f.icon} ${t.title} · Teil ${i + 1} von ${slides.length}${t.src ? ' · 📘 ' + t.src : ''}</div><h1>${sl.h}</h1><div id="sb">${sl.html || ''}</div></div>
      <div class="lessonbar"><div class="inner"><button class="btn ghost big" id="prev" ${i ? '' : 'disabled'} aria-label="Zurück">←</button><button class="btn ${i === slides.length - 1 ? 'go' : 'blue'} big" id="next">${i === slides.length - 1 ? 'Fertig – jetzt üben! 🚀' : 'Weiter'}</button></div></div>`;
    $('#sayl').onclick = () => say(sl.h + '. ' + [...$('#sb').children].filter(e => !e.classList.contains('later')).map(e => e.innerHTML).join(' '));
    $('#prev').onclick = () => go('lesson', id, i - 1);
    const next = () => i === slides.length - 1 ? finishLesson(id) : go('lesson', id, i + 1);
    const parts = sl.html && !sl.kind ? [...$('#sb').children] : [];
    let shown = parts.length > 2 ? 1 : parts.length;
    const paint = () => { parts.forEach((el, k) => el.classList.toggle('later', k >= shown)); $('#next').textContent = shown < parts.length ? 'Weiter ▾' : i === slides.length - 1 ? 'Fertig – jetzt üben! 🚀' : 'Weiter'; };
    if (parts.length > 2) paint();
    const reveal = () => { if (shown >= parts.length) return false; const el = parts[shown++]; paint(); el.classList.add('appear'); el.scrollIntoView({ behavior: 'smooth', block: 'center' }); if (S.settings.autoread) say(el.innerHTML); return true; };
    if (S.settings.autoread) say(sl.h + '. ' + (parts.length ? parts.slice(0, shown).map(e => e.innerHTML).join(' ') : ''));
    $('#next').onclick = () => reveal() || next();
    const sb = $('#sb');
    if (sl.kind === 'check') {
      sb.innerHTML = `<p class="muted">Probier gleich eine Frage. Wenn du nicht weiterweißt, nimm einen Tipp!</p><div id="tb"></div>`;
      const ct = makeTask(pickQs(t.qs, 1)[0], 1);
      mountTask($('#tb'), ct, { onResult: r => record(ct, r), onNext: next, nextLabel: 'Weiter →' }); $('#tb').classList.add('inline-task');
    }
    if (sl.kind === 'reflect') sb.innerHTML = `<p>Stell dir vor, deine Freundin war krank und hat das verpasst. Wie würdest du es ihr in 2–3 Sätzen erklären? Schreib es auf – so merkt sich dein Gehirn es viel besser! 🧠</p><textarea id="note" placeholder="Also, das ist so: ...">${esc(S.notes[id] || '')}</textarea><p class="small muted">Das ist freiwillig – du kannst auch einfach auf „Fertig“ tippen.</p>`;
  },

  practice(sess) {
    const it = sess.list[sess.i];
    if (!FRAGE[it.qid]) { sess.i++; return sess.i >= sess.list.length ? go('summary', sess) : go('practice', sess); }
    const task = makeTask(it.qid, it.lvl, !!sess.test); if (it.mistake) Object.assign(task, { fromMistake: true, mid: it.mistake.mid });
    let combo = 0; for (let k = sess.res.length - 1; k >= 0 && sess.res[k].ok && !sess.res[k].tries; k--) combo++;
    app().innerHTML = `<div class="task-wrap practice-task"><div class="focusbar"><button class="x-btn" onclick="quitPractice(${sess.i})" aria-label="Beenden">✕</button><div class="progress" title="Frage ${sess.i + 1} von ${sess.list.length}"><i style="width:${sess.i / sess.list.length * 100}%"></i></div><div class="combo ${combo ? '' : 'zero'}" title="richtig hintereinander">🔥 ${combo}</div></div>${sess.title ? `<div class="slide-meta center" style="margin:-8px 0 10px">${sess.title}</div>` : ''}<div id="tb"></div></div>`;
    mountTask($('#tb'), task, {
      onResult: r => { const had = dayRec().goal; sess.res.push(Object.assign({ qid: task.qid, thema: task.thema, fixed: !!task.fromMistake && r.ok }, r)); record(task, r); if (!had && dayRec().goal) sess.goalHit = true; const pi = $('.progress i'); if (pi) pi.style.width = (sess.i + 1) / sess.list.length * 100 + '%'; if (r.ok && !r.tries) { const c = $('.combo'); if (c) { c.classList.remove('zero'); c.textContent = '🔥 ' + (combo + 1); } } },
      onNext: () => { sess.i++; sess.i >= sess.list.length ? go(sess.goalHit ? 'goal' : 'summary', sess) : go('practice', sess); },
      nextLabel: sess.i === sess.list.length - 1 ? 'Fertig 🏁' : 'Weiter', test: !!sess.test,
    });
  },

  summary(sess) {
    const ok = sess.res.filter(r => r.ok).length, n = sess.res.length, first = sess.res.filter(r => r.ok && !r.tries).length, xp = sess.res.reduce((a, r) => a + r.xp, 0);
    if (n && first === n && n >= 5) { S.perfect++; save(); }
    const ratio = n ? ok / n : 0, pct = Math.round(ratio * 100);
    if (sess.test && n) { S.probes = (S.probes || 0) + 1; if (gradeOf(pct)[1] === 1) S.probe1 = (S.probe1 || 0) + 1; save(); }
    checkBadges();
    const msg = ratio >= .9 ? 'Unglaublich! Du bist eine echte Wissens-Heldin!' : ratio >= .7 ? 'Richtig stark! Man merkt, dass du übst.' : ratio >= .5 ? 'Gut gemacht! Jeder Fehler hat dir heute etwas beigebracht.' : 'Das war heute schwierig – und du hast trotzdem durchgehalten. Genau so wird man besser! 🌱';
    const byT = {}; sess.res.forEach(r => { (byT[r.thema] ||= { n: 0, ok: 0 }); byT[r.thema].n++; if (r.ok) byT[r.thema].ok++; });
    const weak = Object.entries(byT).filter(([, v]) => v.ok / v.n < .6).map(([k]) => THEMA[k]).filter(t => t && t.lern.length);
    const g = gradeOf(pct);
    const testInfo = sess.test ? `<div class="card" style="text-align:left;margin:14px 0"><div class="row" style="flex-wrap:nowrap"><div class="grade" style="--gc:${g[3]}">${g[1]}</div><div><h3 style="margin:0">📝 Probe-Test: ${ok} von ${n} richtig (${pct} %)</h3><div>Das wäre ungefähr ein <b>„${g[2]}“</b>.</div><div class="small muted">Jede Lehrerin bewertet etwas anders – das ist nur eine Schätzung.</div></div></div>
      <div style="margin-top:10px">${Object.entries(byT).map(([k, v]) => `<div>${THEMA[k].icon} ${THEMA[k].title}: <b>${v.ok}/${v.n}</b> ${v.ok === v.n ? '✅' : v.ok / v.n >= .5 ? '🟡' : '🔴'}</div>`).join('')}</div><p class="small muted" style="margin-bottom:0">🔴 = da lohnt sich der Lernzettel nochmal · Alle falschen Fragen sind jetzt in der Fehler-Kiste.</p></div>` : '';
    const mood = ratio >= .7 ? 'cheer' : ratio >= .5 ? 'happy' : 'comfort';
    app().innerHTML = `<div class="task-wrap center" style="padding-top:10px"><div style="display:flex;justify-content:center">${fuxi(mood, 150, 'bob')}</div><h1 style="margin-top:8px">${sess.test ? 'Probe-Test fertig!' : 'Geschafft!'}</h1><p style="font-size:20px;font-weight:700;margin-top:0">${msg}</p>
      <div class="result-tiles"><div class="rt" style="--c:#ffc800"><div class="rl">XP</div><div class="rv">⚡ ${xp}</div></div><div class="rt" style="--c:#58cc02"><div class="rl">Richtig</div><div class="rv">🎯 ${ok}/${n}</div></div><div class="rt" style="--c:#1cb0f6"><div class="rl">1. Versuch</div><div class="rv">💪 ${first}</div></div></div>
      ${newBadgesHTML()}
      ${sess.res.some(r => r.fixed) ? `<div class="card" style="margin:0 0 16px;border-color:#b6ec8e;box-shadow:0 4px 0 #b6ec8e;font-weight:800">🧰 Du hast <b>${sess.res.filter(r => r.fixed).length}</b> Fehler aus der Fehler-Kiste geknackt! 💪</div>` : ''}
      ${testInfo}
      ${weak.length ? `<div class="merke" style="text-align:left">Fuxi empfiehlt: Lies nochmal den Lernzettel zu <b>${weak.map(t => t.title).join('</b> und <b>')}</b>. 📖</div><div class="row" style="justify-content:center;margin-bottom:14px">${weak.slice(0, 2).map(t => `<button class="btn blue" onclick="go('lesson','${t.id}')">${t.icon} ${t.title}</button>`).join('')}</div>` : ''}
      ${!STORAGE_OK && !SAVE_HANDLE ? `<div class="merke" style="text-align:left;border-color:#ffc1c1">Damit dein Fortschritt nicht verloren geht: <div class="row" style="margin-top:6px">${saveFileButtons()}</div></div>` : ''}
      <button class="btn go big wide" style="max-width:420px;margin-top:8px" onclick="go(BACK||'home',...(BACK_ARGS||[]))">Weiter</button></div>`;
    if (ratio >= .7) { confetti(180); sndWin(); }
  },

  cards(c) {
    const qid = c.list[c.i], q = FRAGE[qid], th = THEMA[q.thema], f = FACH[th.fach];
    const front = q.kind === 'gap' ? q.q.replace(/_{3,}/g, '<u>&nbsp;?&nbsp;</u>') : q.kind === 'tf' ? q.q + '<div class="small muted" style="margin-top:8px">Richtig oder falsch?</div>' : q.q;
    app().innerHTML = `<div class="task-wrap"><div class="focusbar"><button class="x-btn" onclick="go(BACK||'home',...(BACK_ARGS||[]))" aria-label="Beenden">✕</button><div class="progress"><i style="width:${c.i / c.list.length * 100}%"></i></div><div class="combo">🃏 ${c.i + 1}/${c.list.length}</div></div>
      <div class="flash" id="fl"><div class="fc"><div class="side front"><small>${f.icon} ${th.title}</small>${front}<div class="small muted" style="margin-top:16px">👆 Tippen zum Umdrehen</div></div>
      <div class="side back"><small>Antwort</small>${answerText(q)}${q.erk ? `<div class="erk">${q.erk}</div>` : ''}</div></div></div>
      <div class="row hidden" id="rate" style="justify-content:center"><button class="btn danger big" data-r="0">😕 Noch nicht</button><button class="btn go big" data-r="1">😊 Wusste ich!</button></div>
      <p class="center small muted">Überleg dir zuerst die Antwort im Kopf (oder sag sie laut) – dann umdrehen.</p></div>`;
    $('#fl').onclick = () => { $('#fl').classList.toggle('flip'); $('#rate').classList.remove('hidden'); buzz(8); };
    $$('[data-r]').forEach(b => b.onclick = () => {
      S.cards = (S.cards || 0) + 1; if (b.dataset.r === '0') { c.again.push(qid); const s = qs(qid); s.b = Math.min(s.b, 1); }
      tp(q.thema).last = today(); save(); checkBadges();
      c.i++; if (c.i < c.list.length) return go('cards', c);
      if (c.again.length) { toast(`🔁 Die ${c.again.length} schwierigen Karten nochmal!`); return go('cards', { list: shuffle(c.again), i: 0, again: [] }); }
      toast('🃏 Alle Karten geschafft! Jetzt üben?', 3000); confetti(80); go(BACK || 'home', ...(BACK_ARGS || []));
    });
  },

  tour(i = 0) {
    const T = [['wave', 'Du suchst aus, ich frage ab', 'Tippe auf der Startseite auf ein <b>Fach</b>. Dort findest du deine <b>Themen</b>, den <b>Lernzettel</b> zum Nachlesen, <b>🃏 Lernkarten</b> und Fragen zum Üben. Steht ein Test an, zeige ich dir den Countdown und deinen <b>Plan</b> bis dahin.'],
      ['think', 'Tipps und Fehler sind erlaubt', 'Wenn du nicht weiterweißt, tippe auf <b>💡 Tipp</b>. Falsche Fragen kommen in die <b>🧰 Fehler-Kiste</b> – dort kannst du sie später knacken. Am Anfang darfst du auswählen, später schreibst du die Antworten selbst – wie beim echten Test.'],
      ['happy', 'Generalprobe', 'Kurz vor einem Test gibt es den <b>📝 Probe-Test</b>: ohne Tipps, alles selbst schreiben, und am Ende sage ich dir, welche Note das ungefähr wäre. Übst du jeden Tag ein bisschen, wächst deine 🔥 <b>Serie</b>!']];
    const [m, h, txt] = T[i], last = i === T.length - 1;
    app().innerHTML = `<div class="task-wrap center" style="padding-top:10px"><div class="dots" style="max-width:220px;margin:0 auto 18px">${T.map((_, k) => `<i class="${k <= i ? 'on' : ''}"></i>`).join('')}</div>
      <div style="display:flex;justify-content:center">${fuxi(m, 150, 'bob')}</div><h1>${h}</h1><div class="card" style="text-align:left;font-size:19px">${txt}</div>
      <div class="row" style="justify-content:center;margin-top:22px"><button class="btn ghost" id="tskip">Überspringen</button><button class="btn ${last ? 'go' : 'blue'} big" id="tnext" style="min-width:200px">${last ? "Los geht's! 🚀" : 'Weiter'}</button></div></div>`;
    const end = () => { S.toured = true; save(); go('home'); };
    $('#tskip').onclick = end; $('#tnext').onclick = () => last ? end() : go('tour', i + 1);
  },

  goal(sess) {
    const st = streak(), mon = new Date(); mon.setDate(mon.getDate() - (mon.getDay() + 6) % 7);
    const week = ['Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa', 'So'].map((w, k) => { const d = new Date(mon); d.setDate(mon.getDate() + k); const key = dkey(d), r = S.days[key]; return { w, done: r && r.n > 0, today: key === today(), future: key > today() }; });
    app().innerHTML = `<div class="task-wrap center celebrate"><div style="display:flex;justify-content:center">${fuxi('cheer', 140, 'bob')}</div>
      <div class="streak-big">🔥 <span id="stn">${Math.max(0, st - 1)}</span></div><h1 style="margin:0">${st === 1 ? 'Tag' : 'Tage'} in Folge!</h1>
      <p style="font-size:19px;font-weight:700">🎯 Tagesziel geschafft! ${st > 1 ? `Du hast schon ${st} Tage hintereinander geübt – so bleibt alles im Kopf!` : 'Komm morgen wieder, dann wächst deine Serie! 🔥'}</p>
      <div class="week">${week.map(d => `<div class="wd ${d.done ? 'done' : ''} ${d.today ? 'today' : ''} ${d.future ? 'future' : ''}"><div class="wl">${d.w}</div><div class="wc">${d.done ? '🔥' : ''}</div></div>`).join('')}</div>

    setTimeout(() => { const n = $('#stn'); if (n) { n.textContent = st; n.classList.add('bump'); } sndWin(); confetti(200); }, 500);

  badges() {

    app().innerHTML = `<h1>🏆 Meine Erfolge</h1><div class="card"><div class="row" style="flex-wrap:nowrap"><div class="big-ic" style="font-size:54px;width:88px;height:88px;border-radius:50%;display:grid;place-items:center;background:var(--pri-soft);box-shadow:0 5px 0 var(--line2);flex:none">${S.profile.avatar}</div><div style="flex:1;min-width:0"><h2 style="margin:0">${esc(S.profile.name)}</h2><div><b>Level ${L.l}</b> – ${L.title}</div><div class="progress" style="margin:8px 0 2px"><i style="width:${L.pct}%;background:var(--pri)"></i></div><div class="small muted">${S.xp} XP · noch ${L.need} XP bis Level ${L.l + 1}</div></div></div>
      <div class="result-tiles" style="margin-bottom:0"><div class="rt" style="--c:#1cb0f6"><div class="rl">Fragen</div><div class="rv">✏️ ${S.total}</div></div><div class="rt" style="--c:#ff9600"><div class="rl">Tage am Stück</div><div class="rv">🔥 ${streak()}</div></div><div class="rt" style="--c:#ffc800"><div class="rl">Sterne</div><div class="rv">⭐ ${THEMEN.reduce((a, t) => a + starsOf(t.id), 0)}</div></div></div></div>
      <h2>Abzeichen <span class="muted small">${S.badges.length} von ${BADGES.length}</span></h2><div class="grid g3">${BADGES.map(b => `<div class="card badge ${S.badges.includes(b.id) ? '' : 'locked'}"><div class="ic">${b.icon}</div><b>${b.name}</b><div class="small muted">${b.desc}</div></div>`).join('')}</div>
      <p class="center" style="margin-top:22px"><button class="btn ghost" onclick="header();VIEWS.onboarding(true)">✏️ Name / Tier ändern</button></p>`;
  },

  parentsGate() {
    const a = rnd(12, 19), b = rnd(12, 19);
    app().innerHTML = `<div class="card center" style="max-width:480px;margin:30px auto"><h1>👨‍👩‍👧 Elternbereich</h1><p>Bitte lösen, um fortzufahren:</p><p style="font-size:28px;font-weight:900">${a} · ${b} = ?</p><input class="ans" id="pg" inputmode="numeric"><div class="row" style="justify-content:center;margin-top:14px"><button class="btn ghost" onclick="go('home')">Zurück</button><button class="btn primary" id="pgo">Öffnen</button></div></div>`;
    const ok = () => +$('#pg').value === a * b ? go('parents') : (toast('Leider falsch.'), go('parentsGate'));
    $('#pgo').onclick = ok; $('#pg').onkeydown = e => { if (e.key === 'Enter') ok(); }; $('#pg').focus();
  },

  parents() {
    header();
    const days = []; for (let k = 27; k >= 0; k--) { const d = new Date(); d.setDate(d.getDate() - k); days.push([dkey(d), S.days[dkey(d)], d]); }
    const act = Object.values(S.days).filter(d => d.n > 0), tot = act.reduce((a, d) => a + d.n, 0), ok1 = act.reduce((a, d) => a + (d.ok1 || 0), 0), sec = act.reduce((a, d) => a + d.sec, 0);
    const last7 = days.slice(-7).filter(([, d]) => d && d.n > 0).length;
    const mByT = {}; liveMistakes().forEach(m => { const t = FRAGE[m.qid].thema; mByT[t] = (mByT[t] || 0) + 1; });
    const tests = allTests().sort((a, b) => (a.date || '').localeCompare(b.date || '')), hidden = TESTS_C.filter(t => (S.testEdit[t.id] || {}).hidden);
    app().innerHTML = `<div class="row" style="justify-content:space-between"><h1>👨‍👩‍👧 Elternbereich <span class="small muted" style="font-weight:400">Version ${APP_VER}</span></h1><button class="btn ghost" onclick="go('home')">Zurück zur App</button></div>
      ${syncCard()}
      <div class="grid g3"><div class="card center"><div class="stat">${last7}/7</div><div class="small muted">Übungstage letzte Woche</div></div><div class="card center"><div class="stat">${tot}</div><div class="small muted">Fragen gesamt</div></div>
        <div class="card center"><div class="stat">${tot ? Math.round(ok1 / tot * 100) : 0}%</div><div class="small muted">beim 1. Versuch richtig</div></div><div class="card center"><div class="stat">${act.length ? Math.round(sec / 60 / act.length) : 0} min</div><div class="small muted">Ø Lernzeit pro Übungstag</div></div>
        <div class="card center"><div class="stat">${S.lessons}</div><div class="small muted">Lernzettel durchgearbeitet</div></div><div class="card center"><div class="stat">${liveMistakes().length}</div><div class="small muted">offene Fehler in der Kiste</div></div></div>
      <h2>📅 Tests & Schularbeiten</h2><div class="card">
        ${tests.length ? `<table class="ptbl"><tr><th>Fach</th><th>Test</th><th>Datum</th><th>Stoff</th><th>bereit</th><th></th></tr>${tests.map(t => { const i = testInfo(t); return `<tr><td>${FACH[t.fach].icon} ${FACH[t.fach].name}</td><td>${esc(t.name)}${t.own ? '' : ' <span class="tag school">aus dem Stoff</span>'}</td><td><input type="date" class="ans" style="width:160px;font-size:15px;padding:4px" data-td="${t.id}" value="${t.date || ''}"></td><td class="small">${(t.themen.length ? t.themen : fachThemen(t.fach).map(x => x.id)).map(id => THEMA[id]?.title).filter(Boolean).join(', ')}</td><td>${i ? i.ready + ' %' : '<span class="muted small">vorbei</span>'}</td><td><button class="btn ghost" style="padding:4px 10px;font-size:14px" data-tx="${t.id}">${t.own ? '🗑️' : 'ausblenden'}</button></td></tr>`; }).join('')}</table>` : '<p class="muted" style="margin-top:0">Noch keine Tests eingetragen.</p>'}
        ${hidden.length ? `<p class="small">Ausgeblendet: ${hidden.map(t => `${esc(t.name)} <button class="btn ghost" style="padding:2px 8px;font-size:13px" data-tu="${t.id}">zeigen</button>`).join(' ')}</p>` : ''}
        <h3 style="margin-top:18px">➕ Test eintragen</h3>
        <div class="row"><label>Fach: <select id="nf" class="ans" style="width:auto;font-size:17px">${FAECHER.map(f => `<option value="${f.id}">${f.icon} ${f.name}</option>`).join('')}</select></label><label>Name: <input id="nn" class="ans" style="width:200px;font-size:17px;text-align:left" placeholder="z. B. Bio-Test"></label><label>Datum: <input id="nd" type="date" class="ans" style="width:180px;font-size:17px"></label></div>
        <div id="nth" class="focus-list" style="margin-top:10px"></div>
        <button class="btn primary" id="nadd" style="margin-top:8px">Test speichern</button>
        <p class="small muted" style="margin-bottom:0">Ohne Hakerl gilt der ganze Stoff des Fachs. Vor einem Test zeigt die App auf der Fach-Seite einen Countdown mit Plan, und das Tagestraining übt 14 Tage vorher vor allem diesen Stoff.</p></div>
      <h2>📚 Neuen Lernstoff in die App bringen</h2><div class="card small"><p style="margin-top:0">Fotos vom Heft, Buch, Arbeitsblatt oder der Stoffangabe an Claude schicken (mit Fach und Testdatum). Claude macht daraus einen <b>Lernzettel</b>, <b>Fragen in allen Formen</b> (Auswahl, selbst schreiben, Lückentext, Zuordnen, Reihenfolge, richtig/falsch) und trägt den <b>Test-Termin</b> ein. Nach dem Veröffentlichen ist der neue Stoff beim nächsten Öffnen da – der bisherige Fortschritt bleibt erhalten.</p></div>
      <h2>📈 Stand pro Fach und Thema</h2><div class="card" style="overflow-x:auto"><table class="ptbl"><tr><th>Thema</th><th>Gelernt</th><th>Fragen sitzen</th><th>beantwortet</th><th>richtig</th><th>offene Fehler</th><th>zuletzt</th></tr>
        ${FAECHER.map(f => fachThemen(f.id).length ? `<tr><td colspan="7" style="background:${f.c}18;font-weight:900">${f.icon} ${f.name}</td></tr>` + fachThemen(f.id).map(t => { const s = tp(t.id), m = masteryOf(t.id); return `<tr><td>${t.icon} ${t.title}${s.lesson ? ' 📖' : ''}</td><td style="min-width:110px"><div class="mbar"><i style="width:${m}%"></i></div><span class="small">${m}%</span></td><td>${t.qs.filter(q => qsPeek(q).b >= BOX_MAX).length}/${t.qs.length}</td><td>${s.seen}</td><td>${s.seen ? Math.round(s.ok / s.seen * 100) + '%' : '–'}</td><td>${mByT[t.id] || ''}</td><td class="small">${s.last ? new Date(s.last).toLocaleDateString('de-AT') : '–'}</td></tr>`; }).join('') : '').join('')}</table>
        <p class="small muted">📖 = Lernzettel gelesen. Eine Frage „sitzt“, wenn sie ${BOX_MAX}-mal hintereinander beim 1. Versuch ohne Tipp richtig war. Fragen, die noch nicht sitzen, kommen öfter dran.</p></div>
      ${Object.keys(S.notes).length ? `<h2>💭 Eigene Erklärungen Ihres Kindes</h2><div class="card">${Object.entries(S.notes).filter(([k]) => THEMA[k]).map(([k, v]) => `<p><b>${THEMA[k].title}:</b> <i>„${esc(v)}“</i></p>`).join('')}</div>` : ''}
      <h2>📅 Letzte 4 Wochen</h2><div class="card"><div class="cal">${days.map(([k, d, dt]) => `<i title="${dt.toLocaleDateString('de-AT')}: ${d ? d.n : 0} Fragen" style="background:${!d || !d.n ? '#f1e8df' : d.goal ? '#16a34a' : '#86efac'}">${dt.getDate()}</i>`).join('')}</div><p class="small muted">Dunkelgrün = Tagesziel erreicht · Hellgrün = geübt</p></div>
      <h2>💾 Speichern</h2><div class="card small"><p style="margin-top:0">${STORAGE_OK ? '✅ <b>Automatisches Speichern im Browser funktioniert.</b>' : '❌ <b>Dieser Browser kann hier nichts speichern</b> (Inkognito/Vorschau?).'} Zusätzlich gibt es eine zweite Sicherung im Browser, die den Stand zurückholt, falls der normale Speicher geleert wird.</p>
        <p><b>Spielstand-Datei</b> (empfohlen am Laptop): Jede Antwort wird automatisch auch in eine eigene Datei geschrieben – unabhängig vom Browser.${S.fileSaved && SAVE_HANDLE ? ` Zuletzt gespeichert: ${new Date(S.fileSaved).toLocaleTimeString('de-AT')}.` : ''}</p><div class="row" style="margin:6px 0">${saveFileButtons()}</div>
        ${FS_API ? '<p class="muted">Nach dem Schließen fragt der Browser beim nächsten Öffnen einmal, ob die App die Datei wieder benutzen darf – dann <b>„Bei jedem Besuch zulassen“</b> wählen.</p>' : '<p class="muted">Dieser Browser kann nicht automatisch in eine Datei schreiben (z. B. am Handy). Hier sichert der Familien-Code alles online, oder „Spielstand herunterladen“ von Hand.</p>'}
        <p style="margin-bottom:0">Gespeichert: Name <b>${S.profile ? esc(S.profile.name) : '–'}</b> · ${S.total} Fragen · ${Object.keys(S.days).length} Übungstage${S.sync ? ' · ☁️ online abgeglichen' : ''}</p></div>
      <h2>⚙️ Einstellungen</h2><div class="card"><div class="row"><label>Tagesziel: <select id="goal" class="ans" style="width:auto;font-size:18px">${[5, 8, 10, 12, 15, 20].map(n => `<option ${n === S.settings.goal ? 'selected' : ''} value="${n}">${n} Fragen (~${n} min)</option>`).join('')}</select></label></div>
        <p><label><input type="checkbox" id="snd" ${S.settings.sound ? 'checked' : ''}> Töne & Vibration</label> &nbsp; <label><input type="checkbox" id="voi" ${S.settings.voice ? 'checked' : ''}> Vorlese-Knopf 🔊 anzeigen</label></p>
        <p><label><input type="checkbox" id="aread" ${S.settings.autoread ? 'checked' : ''}> Fragen und Lernzettel <b>automatisch vorlesen</b></label></p>
        <p><label><input type="checkbox" id="bigf" ${S.settings.big ? 'checked' : ''}> <b>Große Schrift</b></label> &nbsp; <button class="btn ghost" onclick="S.toured=false;save();go('home')">🦊 Einführung nochmal zeigen</button></p>
        <div class="row"><button class="btn" onclick="downloadSave()">💾 Fortschritt sichern (Datei)</button><label class="btn" style="cursor:pointer">📂 Sicherung laden<input type="file" id="imp" accept=".json" hidden></label><button class="btn ghost" id="clrm">Fehler-Kiste leeren</button><button class="btn ghost" id="rst" style="color:var(--bad)">Alles zurücksetzen</button></div></div>
      <h2>💡 So unterstützen Sie Ihr Kind am besten</h2><div class="card"><ul style="margin:0;padding-left:22px">
        <li><b>Verteilt statt geballt:</b> Ab etwa 10 Tagen vor dem Test täglich 10–15 Minuten wirken viel mehr als ein langer Abend davor.</li>
        <li><b>Abrufen statt nur Lesen:</b> Fragen beantworten (auch falsch!) festigt Wissen stärker als den Text mehrmals durchzulesen. Darum fragt die App ab, statt nur zu zeigen.</li>
        <li><b>Selbst schreiben:</b> Bei Tests muss man die Antwort selbst wissen. Die App lässt anfangs auswählen und verlangt später freies Schreiben.</li>
        <li><b>Erklären lassen:</b> „Erklär mir, was ihr da gelernt habt“ ist die beste Wiederholung.</li>
        <li><b>Anstrengung loben, nicht Talent:</b> „Du bist drangeblieben!“ statt „Du bist so schlau“.</li></ul></div>`;
    const drawTh = () => { const f = $('#nf').value; $('#nth').innerHTML = fachThemen(f).map(t => `<label><input type="checkbox" data-nt="${t.id}"> ${t.title}</label>`).join('') || '<span class="small muted">Für dieses Fach gibt es noch keinen Stoff – der Test gilt dann für alles, was später dazukommt.</span>'; };
    $('#nf').onchange = drawTh; drawTh();
    $('#nadd').onclick = () => { const date = $('#nd').value; if (!date) return toast('Bitte ein Datum wählen.'); const fid = $('#nf').value; S.tests.push({ id: 'own' + Date.now(), fach: fid, name: $('#nn').value.trim() || FACH[fid].name + '-Test', date, themen: $$('[data-nt]').filter(x => x.checked).map(x => x.dataset.nt) }); save(); toast('✅ Test eingetragen'); VIEWS.parents(); };
    $$('[data-td]').forEach(i => i.onchange = () => { const id = i.dataset.td, own = S.tests.find(t => t.id === id); if (own) own.date = i.value; else S.testEdit[id] = Object.assign({}, S.testEdit[id], { date: i.value }); save(); toast('✅ Datum gespeichert'); });
    $$('[data-tx]').forEach(b => b.onclick = () => { const id = b.dataset.tx; if (S.tests.some(t => t.id === id)) { if (!confirm('Diesen Test löschen?')) return; S.tests = S.tests.filter(t => t.id !== id); } else S.testEdit[id] = Object.assign({}, S.testEdit[id], { hidden: true }); save(); VIEWS.parents(); });
    $$('[data-tu]').forEach(b => b.onclick = () => { S.testEdit[b.dataset.tu] = Object.assign({}, S.testEdit[b.dataset.tu], { hidden: false }); save(); VIEWS.parents(); });
    $('#goal').onchange = e => { S.settings.goal = +e.target.value; save(); header(); };
    $('#snd').onchange = e => { S.settings.sound = e.target.checked; save(); };
    $('#voi').onchange = e => { S.settings.voice = e.target.checked; save(); };
    $('#aread').onchange = e => { S.settings.autoread = e.target.checked; save(); if (e.target.checked) say('Ab jetzt lese ich dir alles vor.'); };
    $('#bigf').onchange = e => { S.settings.big = e.target.checked; save(); go('parents'); };
    $('#imp').onchange = e => { const f = e.target.files[0]; if (!f) return; f.text().then(txt => { try { const s = JSON.parse(txt); if (!s.q) throw 0; S = mergeStates(S, s); save(); toast('✅ Sicherung geladen'); VIEWS.parents(); } catch (err) { toast('Diese Datei ist keine gültige Sicherung.'); } }); };
    $('#clrm').onclick = () => { if (confirm('Fehler-Kiste wirklich leeren?')) { S.mistakes = []; S.mClear = Date.now(); save(); VIEWS.parents(); } };
    $('#rst').onclick = () => { if (confirm('Wirklich ALLES löschen (Name, Fortschritt, Abzeichen)? Das kann nicht rückgängig gemacht werden.')) { const sync = S.sync; S = defState(); S.sync = sync; save(); go('home'); } };
  },
};

/* ---------- Aktionen ---------- */
const sessGo = (list, o = {}) => list.length ? go('practice', Object.assign({ list, i: 0, res: [] }, o)) : toast('Hier gibt es noch keine Fragen.');
function startDaily() { sessGo(buildDaily(), { mode: 'daily' }); }
function startTopic(id) { sessGo(pickQs(THEMA[id].qs, Math.min(8, THEMA[id].qs.length)).map(qid => ({ qid }))); }
function startFach(fid) { sessGo(spreadThemen(pickQs(qsOfThemen(fachThemen(fid).map(t => t.id)), 10).map(qid => ({ qid })))); }
const findTest = id => upcoming().find(t => t.id === id);
function startTestPrep(id, n = 10) { const t = findTest(id); sessGo(spreadThemen(pickQs(qsOfThemen(t.ids), n).map(qid => ({ qid }))), { title: '📝 Training für: ' + t.name }); }
function startProbe(id, fid) {
  const t = id && findTest(id), ids = t ? t.ids : fachThemen(fid).map(x => x.id), all = qsOfThemen(ids);
  // gleichmäßig über alle Themen des Tests verteilt
  const per = {}; all.forEach(q => (per[FRAGE[q].thema] ||= []).push(q));
  const lists = Object.values(per).map(shuffle), list = []; let k = 0;
  while (list.length < Math.min(12, all.length)) { const l = lists[k++ % lists.length]; if (l.length) list.push(l.pop()); }
  sessGo(shuffle(list).map(qid => ({ qid })), { mode: 'test', test: true, title: '📝 Probe-Test' + (t ? ': ' + t.name : ' ' + FACH[fid].name) });
}
function startCards(testId, fid, themaId) {
  const ids = themaId ? [themaId] : testId ? findTest(testId).ids : fachThemen(fid).map(t => t.id);
  const list = pickQs(qsOfThemen(ids).filter(q => FRAGE[q].kind !== 'order' && FRAGE[q].kind !== 'match'), 15);
  if (!list.length) return toast('Hier gibt es noch keine Karten.');
  go('cards', { list, i: 0, again: [] });
}
function startMistakes() {
  const m = liveMistakes(); if (!m.length) return toast('Deine Fehler-Kiste ist leer! 🎉');
  sessGo(shuffle(m).slice(0, 10).map(x => ({ qid: x.qid, mistake: x })), { mode: 'mistakes', title: '🧰 Fehler-Kiste' });
}
function finishLesson(id) {
  const note = $('#note')?.value.trim(); if (note) S.notes[id] = note; else delete S.notes[id];
  const s = tp(id); if (!s.lesson) { s.lesson = true; S.lessons++; S.xp += 15; toast('📖 Lernzettel geschafft! <b>+15 XP</b>'); }
  save(); checkBadges(); startTopic(id);
}

window.addEventListener('DOMContentLoaded', async () => {
  go('home'); if ('speechSynthesis' in window) speechSynthesis.getVoices();
  if (IS_WEB && 'serviceWorker' in navigator) {
    const hadCtrl = !!navigator.serviceWorker.controller; let reloaded = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => { if (!hadCtrl || reloaded) return; reloaded = true; const r = () => location.reload(); if (['practice', 'lesson', 'cards'].includes(VIEW)) addEventListener('visibilitychange', r, { once: true }); else r(); });
    navigator.serviceWorker.register('sw.js').then(reg => { reg.update(); setInterval(() => reg.update(), 30 * 60 * 1000); }).catch(() => { });
  }
  try { if (navigator.storage?.persist && !(await navigator.storage.persisted())) await navigator.storage.persist(); } catch (e) { }
  await restoreHandle();
  const b = await idbLoad();
  if (b) { try { const s = JSON.parse(b); if (s.profile && (!S.profile || (s.total || 0) > (S.total || 0))) { S = mergeStates(S, s); try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { } go('home'); toast(`✅ Willkommen zurück, ${esc(S.profile.name)}!`, 4000); } } catch (e) { } }
  else if (S.profile) idbSave();
  if (SAVE_HANDLE || RECONNECT) go(VIEW === 'onboarding' && S.profile ? 'home' : VIEW, ...VIEW_ARGS);
  const hc = (location.hash.match(/code=([A-Za-z0-9-]+)/) || [])[1];
  if (hc) { history.replaceState(null, '', location.pathname); if (!S.sync || S.sync.code !== cleanCode(hc)) await syncJoin(hc); }
  syncNow();
});
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') syncNow(); else { if (SAVE_HANDLE) { clearTimeout(save.t); writeSaveFile(); } if (S.sync) { clearTimeout(syncSoon.t); syncNow(); } } });
addEventListener('online', () => syncNow());
</script>
